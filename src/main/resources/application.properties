# ==========================================
# Sunucu Portu
# ==========================================
server.port=8080

# ==========================================
# Veritabani Baglantisi (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/medication_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Yapilandirmasi
# Kontrol listesi kurali: ddl-auto=update kullanilmali, create/create-drop kullanilmamali
# ddl-auto=update kullanilmali, create/create-drop kullanilmamalidir (veriler korunmalidir).
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Spring Boot Actuator Yapilandirmasi (Health ve Info)
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==========================================
# Uygulama Bilgisi (/actuator/info endpoint'i icin)
# ==========================================
info.app.name=Saglik Ilac ve Gozlem Yonetim Sistemi
info.app.description=Sunucu Uygulama Gelistirme Dersi RESTful API
info.app.version=1.0.0

# ==========================================
# Ozel Uygulama Ozelligi (Custom Property - Kontrol Listesi Madde 12)
# ==========================================
app.custom.welcome-message=Hosgeldiniz! Saglik Yonetim Sistemi API aktif ve hazir.

# ==========================================
# OpenAPI / Swagger UI Yapilandirmasi (Kontrol Listesi Madde 35)
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
